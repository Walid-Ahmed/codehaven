<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How CodeHaven works: a read-only agent loop, tools, local RAG, and answer checks</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <style>
      .title { font-size: 30px; font-weight: 700; fill: #0b3b2c; }
      .subtitle { font-size: 16px; fill: #4b5563; }
      .h { font-size: 16px; font-weight: 700; fill: #111827; }
      .t { font-size: 13.5px; fill: #374151; }
      .s { font-size: 12.5px; fill: #4b5563; }
      .tool { font-size: 15px; font-weight: 700; fill: #1e3a8a; font-family: Menlo, Consolas, monospace; }
      .mono { font-size: 13px; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
      .label { font-size: 12.5px; font-weight: 600; fill: #ea580c; }
      .flow { stroke: #374151; stroke-width: 2; fill: none; }
      .loop { stroke: #ea580c; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <rect width="1400" height="880" fill="#ffffff"/>
  <!-- 3. Agent loop container, drawn first so arrows stay on top -->
  <rect x="345" y="120" width="655" height="640" rx="16" fill="#fafafa" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="365" y="146" class="h">3 · Agent loop (LangGraph)</text>
  <text x="40" y="58" class="title">How CodeHaven works</text>
  <text x="40" y="88" class="subtitle">One local model, a loop of tool calls, and a local search index (RAG). Everything runs on your machine.</text>

  <!-- 1. You ask -->
  <rect x="40" y="150" width="260" height="80" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="58" y="177" class="h">1 · You ask</text>
  <text x="58" y="200" class="mono">codehaven "explain main.py"</text>
  <text x="58" y="220" class="s">or a --interactive session</text>

  <path d="M170,230 V266" class="flow" marker-end="url(#arrow)"/>

  <!-- 2. Prepare the prompt -->
  <rect x="40" y="270" width="260" height="120" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="58" y="297" class="h">2 · Build the prompt</text>
  <text x="58" y="320" class="t">• rules + your task</text>
  <text x="58" y="340" class="t">• up to 40 relevant file paths</text>
  <text x="58" y="360" class="t">• first passages from RAG</text>
  <text x="58" y="380" class="t">• earlier Q&amp;A (sessions)</text>

  <!-- prompt -> model -->
  <path d="M300,320 H325 V205 H516" class="flow" marker-end="url(#arrow)"/>
  <text x="372" y="197" class="s">prompt</text>

  <!-- RAG panel -->
  <rect x="40" y="430" width="260" height="310" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="58" y="457" class="h">Local RAG index</text>
  <text x="58" y="477" class="s">built at start, refreshed between questions</text>
  <rect x="58" y="490" width="224" height="28" rx="14" fill="#ffffff" stroke="#14b8a6"/>
  <text x="170" y="509" class="t" text-anchor="middle">Your repository code</text>
  <rect x="58" y="524" width="224" height="28" rx="14" fill="#ffffff" stroke="#14b8a6"/>
  <text x="170" y="543" class="t" text-anchor="middle">Your knowledge/ references</text>
  <rect x="58" y="558" width="224" height="28" rx="14" fill="#ffffff" stroke="#14b8a6"/>
  <text x="170" y="577" class="t" text-anchor="middle">Built-in LangGraph docs</text>
  <path d="M170,586 V606" class="flow" marker-end="url(#arrow)"/>
  <text x="58" y="628" class="t"><tspan font-weight="700">BM25</tspan> keyword ranking</text>
  <text x="58" y="650" class="t">+ follow imports (Python, JS/TS)</text>
  <text x="58" y="672" class="t">+ expand to whole functions</text>
  <text x="58" y="700" class="t">→ passages cited as</text>
  <text x="58" y="720" class="mono">path:start-end</text>

  <!-- RAG -> prompt -->
  <path d="M170,430 V394" class="flow" marker-end="url(#arrow)"/>
  <text x="180" y="418" class="s">first search</text>

  <!-- Model -->
  <rect x="520" y="160" width="320" height="110" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="680" y="187" class="h" text-anchor="middle">Model step</text>
  <text x="680" y="209" class="t" text-anchor="middle">qwen2.5-coder:7b on local Ollama</text>
  <text x="680" y="229" class="t" text-anchor="middle">replies with one JSON action</text>
  <text x="680" y="255" class="s" text-anchor="middle">bad reply → 1 retry · repeating → cut off</text>

  <path d="M680,270 V296" class="flow" marker-end="url(#arrow)"/>
  <rect x="450" y="300" width="460" height="36" rx="18" fill="#ffffff" stroke="#9ca3af"/>
  <text x="680" y="323" class="t" text-anchor="middle">action = read · search · retrieve · run_tests</text>
  <path d="M680,336 V361" class="flow" marker-end="url(#arrow)"/>

  <!-- Tools -->
  <rect x="370" y="365" width="540" height="210" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="385" y="388" class="h">Tools · one per step</text>

  <rect x="385" y="400" width="160" height="72" rx="10" fill="#ffffff" stroke="#3b82f6"/>
  <text x="465" y="428" class="tool" text-anchor="middle">retrieve</text>
  <text x="465" y="452" class="s" text-anchor="middle">ask the RAG index</text>
  <rect x="560" y="400" width="160" height="72" rx="10" fill="#ffffff" stroke="#3b82f6"/>
  <text x="640" y="428" class="tool" text-anchor="middle">search</text>
  <text x="640" y="452" class="s" text-anchor="middle">exact text in files</text>
  <rect x="735" y="400" width="160" height="72" rx="10" fill="#ffffff" stroke="#3b82f6"/>
  <text x="815" y="428" class="tool" text-anchor="middle">read</text>
  <text x="815" y="452" class="s" text-anchor="middle">file or line range</text>

  <rect x="385" y="487" width="160" height="72" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-dasharray="5 4"/>
  <text x="465" y="515" class="tool" text-anchor="middle">find names</text>
  <text x="465" y="539" class="s" text-anchor="middle">automatic, before step 1</text>
  <rect x="560" y="487" width="160" height="72" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-dasharray="5 4"/>
  <text x="640" y="515" class="tool" text-anchor="middle">cite parts</text>
  <text x="640" y="539" class="s" text-anchor="middle">automatic: real line ranges</text>
  <rect x="735" y="487" width="160" height="72" rx="10" fill="#ffffff" stroke="#3b82f6"/>
  <text x="815" y="515" class="tool" text-anchor="middle">run_tests</text>
  <text x="815" y="539" class="s" text-anchor="middle">Docker · no network</text>

  <!-- RAG <-> retrieve -->
  <path d="M302,600 H335 V436 H381" class="flow" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Loop back -->
  <path d="M910,470 H960 V235 H844" class="loop" marker-end="url(#arrow-orange)"/>
  <text x="975" y="480" class="label" transform="rotate(-90 975 480)">LOOP: tool result → next step</text>

  <!-- Read-only -->
  <rect x="370" y="595" width="540" height="56" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="640" y="618" class="t" text-anchor="middle"><tspan font-weight="700">Read-only:</tspan> CodeHaven never changes, creates, or deletes files.</text>
  <text x="640" y="638" class="t" text-anchor="middle">Change requests get an explanation with cited lines, not an edit.</text>

  <text x="370" y="690" class="t"><tspan font-weight="700">Loop limits:</tspan> 12 steps by default (--max-steps up to 30).</text>
  <text x="370" y="712" class="t">The same lookup twice, or the last step, asks the model for its final answer.</text>
  <text x="370" y="734" class="t">Tool output is treated as untrusted data, never as instructions.</text>

  <!-- finish -->
  <path d="M840,185 H1046" class="flow" marker-end="url(#arrow)"/>
  <text x="868" y="177" class="s">action = finish</text>

  <!-- 4. Finish -->
  <rect x="1050" y="150" width="310" height="180" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1068" y="177" class="h">4 · Final answer</text>
  <text x="1068" y="202" class="t">Answer checks:</text>
  <text x="1068" y="224" class="t">• each path:line citation must match</text>
  <text x="1083" y="244" class="t">something actually read or found</text>
  <text x="1068" y="266" class="t">• flags repeated or unsupported text</text>
  <text x="1068" y="296" class="t">Streams to your terminal as it is</text>
  <text x="1068" y="316" class="t">written (--no-stream to wait)</text>

  <!-- Memory -->
  <rect x="1050" y="370" width="310" height="190" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="1068" y="397" class="h">Context memory</text>
  <text x="1068" y="422" class="t">• Evidence: paths and lines seen</text>
  <text x="1083" y="442" class="t">(up to 50, kept for citations)</text>
  <text x="1068" y="466" class="t">• Old tool results become</text>
  <text x="1083" y="486" class="t">one-line stubs to fit 12 KB</text>
  <text x="1068" y="510" class="t">• Sessions keep recent questions,</text>
  <text x="1083" y="530" class="t">answers, and evidence</text>
  <path d="M1048,465 H1002" class="flow" stroke-dasharray="5 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Stops -->
  <rect x="1050" y="600" width="310" height="140" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="1068" y="627" class="h">Stops safely</text>
  <text x="1068" y="652" class="t">• step limit reached → exit code 2</text>
  <text x="1068" y="676" class="t">• answer unverified → warning, exit 2</text>
  <text x="1068" y="700" class="t">• two bad replies in a row → exit 1</text>
  <text x="1068" y="724" class="t">• Ollama unreachable → clear error</text>

  <!-- Offline band -->
  <rect x="40" y="790" width="1320" height="60" rx="12" fill="#0b3b2c"/>
  <text x="700" y="826" text-anchor="middle" font-size="16" fill="#ffffff"><tspan font-weight="700">100% local:</tspan> the model runs in Ollama on 127.0.0.1 · tests run in Docker with no network · no cloud APIs, no tracing, no uploads</text>
</svg>
