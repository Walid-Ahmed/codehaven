[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-free-coding-agent"
version = "0.14.0"
description = "CodeHaven: a read-only, offline assistant for understanding code. Your code. Your machine. No API fees."
requires-python = ">=3.10"
readme = "README.md"
keywords = ["code assistant", "offline", "ollama", "local llm", "code search", "rag"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Environment :: Console",
               "Intended Audience :: Developers", "Topic :: Software Development"]
dependencies = ["langgraph>=1.0,<2", "langsmith>=0.3,<1",
    "tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.24", "tree-sitter-go>=0.23,<0.26",
    "tree-sitter-java>=0.23,<0.24", "tree-sitter-rust>=0.23,<0.25", "pathspec>=0.12,<1",
    "tree-sitter-c>=0.23,<0.25", "tree-sitter-cpp>=0.23,<0.24", "tree-sitter-c-sharp>=0.23,<0.25",
    "tree-sitter-ruby>=0.23,<0.24", "tree-sitter-php>=0.23,<0.26", "tree-sitter-kotlin>=1.0,<2",
    "tree-sitter-swift>=0.6,<0.8"]

[project.urls]
Homepage = "https://github.com/Walid-Ahmed/codehaven"
Documentation = "https://github.com/Walid-Ahmed/codehaven#readme"
Issues = "https://github.com/Walid-Ahmed/codehaven/issues"

[project.scripts]
codehaven = "offline_agent.cli:main"
offline-agent = "offline_agent.cli:main"

[tool.setuptools.packages.find]
include = ["offline_agent*"]

[tool.setuptools.package-data]
offline_agent = ["references/*.md", "gui.html", "gui.css", "gui.js", "gui_arabic.js"]

[project.optional-dependencies]
dev = ["ruff>=0.6", "playwright>=1.40,<2", "build>=1.0"]

# Lint for real mistakes only (unused names, undefined names, syntax errors, mutable defaults), not for style.
[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["F", "E9", "B006", "B008"]
